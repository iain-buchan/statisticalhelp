name: Help Editor checks

on:
  push:
    paths: ['HelpEditor/**', '.github/workflows/help-editor.yml']
  pull_request:
    paths: ['HelpEditor/**', '.github/workflows/help-editor.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: HelpEditor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build editor, console builder and test programs
        run: dotnet build StatsDirectHelpEditor.slnx -c Release --nologo
      - name: Core, installed workspace and Git checks
        run: |
          foreach ($name in @('Checks','InstalledWorkspaceChecks','GitChecks','HeadlessChecks','NamespaceChecks')) {
            dotnet run --no-build -c Release --project "tests/StatsDirectHelpEditor.$name" -- $PWD.Path
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Native installed startup and source artwork
        run: |
          foreach ($name in @('InstalledWorkspaceWindowsChecks','SourceImageWindowsChecks','NamespaceWindowsChecks')) {
            dotnet run --no-build -c Release --project "tests/StatsDirectHelpEditor.$name" -- $PWD.Path
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Rebuild all help without Flare or the GUI
        run: ./Build-Help.ps1 -CompileBuilder -Target All
      - name: Validate the StatsDirect authoring schema
        run: ./Schema/Test-ExtensionSchema.ps1 | Out-Null
      - name: Verify source remains clean
        run: |
          git diff --exit-code -- .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and audit the actual WiX installers
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'HelpEditorInstaller'
          ./Build-Installer.ps1 -OutputDirectory $output
          $payload = Join-Path (Get-ChildItem (Join-Path $output '.work') -Directory | Select-Object -First 1).FullName 'payload'
          ./tests/installer-package-checks.ps1 -Msi (Join-Path $output 'StatsDirectHelpEditor-x64.msi') -Bundle (Join-Path $output 'StatsDirectHelpEditorSetup.exe') -PayloadDirectory $payload -ExpectedCommit $env:GITHUB_SHA -Root $PWD.Path
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: help-editor-checks
          path: HelpEditor/evidence/*.json
