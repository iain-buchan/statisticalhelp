    <head><title>Select all in report</title>
        <link rel="StyleSheet" href="../resources/Stylesheets/STATSDIRECT.css" type="text/css" />
    </head>
    <body>
        <h1>Select all</h1>
        <p>&#160;</p>
        <p><b>Select all</b> (Ctrl+A) on the Edit menu and the right-click menu selects every result in the report, and <b>Select result</b> on the right-click menu selects the one under the pointer, as a click on its first heading does. See the <a href="../basics/report_window.htm">Report window</a> topic for editing a report.</p>
    </body>
</html>
