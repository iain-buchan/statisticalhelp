    <head><title>Cut in report</title>

    <body>
        <h1>Cut</h1>
        <p>&#160;</p>
        <p><b>Cut</b> (Ctrl+X) on the Edit menu, the toolbar and the right-click menu removes the selection, whole results among it, and puts it on the clipboard for pasting; <b>Undo</b> brings it back. See the <a href="../basics/report_window.htm">Report window</a> topic for editing a report.</p>
    </body>
</html>
