    <body>
        <h1>Replace</h1>
        <p>&#160;</p>
        <p>A report has no Replace: find the text with <b>Find</b> (Ctrl+F) and edit it. The find bar of the <a href="../basics/r_script_window.htm">R script window</a> has Replace for scripts. See the <a href="../basics/report_window.htm">Report window</a> topic for editing a report.</p>
    </body>
