        <h1>Insert picture</h1>

        <p>The earlier report editor's Insert Picture is gone. Charts come into a report from the analyses that draw them, as vector pictures that you can align, resize and save as SVG or PNG. See the <a href="../basics/report_window.htm">Report window</a> topic for editing a report.</p>
