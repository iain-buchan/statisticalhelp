        <h1>Import text</h1>
        <p>&#160;</p>
        <p>The earlier report editor's Import Text is gone. <b>File &gt; Open</b> opens a plain text file as a new report, and <b>Paste</b> brings text in from the clipboard. See the <a href="../basics/report_window.htm">Report window</a> topic for editing a report.</p>
