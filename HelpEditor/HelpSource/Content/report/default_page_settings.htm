        <h1>Default page settings</h1>
        <p>&#160;</p>
        <p>The earlier report editor's page settings are gone. <b>Print</b> prints a report through the browser's print dialog, where the paper, margins and scale are set. See the <a href="../basics/report_window.htm">Report window</a> topic for editing a report.</p>
