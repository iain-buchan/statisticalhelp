    <head><title>Find in report</title>

    <body>
        <h1>Find</h1>
        <p>&#160;</p>
        <p><b>Find</b> (Ctrl+F) on the Edit menu and the toolbar opens a find bar under the toolbar and shows the text found selected. A report's find bar has no Replace; the R script window's has. See the <a href="../basics/report_window.htm">Report window</a> topic for editing a report.</p>
    </body>
