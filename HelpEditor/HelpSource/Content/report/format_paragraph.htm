        <h1>Format paragraph</h1>
        <p>&#160;</p>
        <p><b>Left</b>, <b>Centre</b>, <b>Right</b> and <b>Justify</b> on the report's toolbar align the paragraph at the cursor or the paragraphs selected, and <b>Left</b>, <b>Centre</b> and <b>Right</b> align a selected chart or picture. See the <a href="../basics/report_window.htm">Report window</a> topic for editing a report.</p>
