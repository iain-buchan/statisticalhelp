    <body>
        <h1>Find and Replace</h1>
        <p>&#160;</p>
        <p><b>Find</b> (Ctrl+F) opens a find bar under the report's toolbar and shows the text found selected. A report has no Replace: edit the text found; the find bar of the <a href="../basics/r_script_window.htm">R script window</a> has Replace. See the <a href="../basics/report_window.htm">Report window</a> topic for editing a report.</p>
    </body>
