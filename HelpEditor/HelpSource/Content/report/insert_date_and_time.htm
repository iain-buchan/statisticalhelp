        <h1>Insert date and time</h1>
        <p>&#160;</p>
        <p>The earlier report editor's Insert Date and Time is gone: type the date where you want it. Each result carries the time of its run in its record. See the <a href="../basics/report_window.htm">Report window</a> topic for editing a report.</p>
