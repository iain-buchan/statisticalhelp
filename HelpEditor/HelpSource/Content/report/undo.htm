        <h1>Undo and Redo</h1>
        <p>&#160;</p>
        <p><b>Undo</b> (Ctrl+Z) and <b>Redo</b> (Ctrl+Y) on the Edit menu and the toolbar step back and forward through your edits, the removal of whole results and moves among them. See the <a href="../basics/report_window.htm">Report window</a> topic for editing a report.</p>
    </body>
